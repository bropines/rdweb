// Wire schema for the rendezvous (hbbs) and relay (hbbr) messages a browser
// client needs. Field numbers and types follow the RustDesk network protocol
// so the messages are byte-compatible with RustDesk servers and peers; only
// the subset used by rdweb is declared. Unknown fields are ignored on decode.
syntax = "proto3";
package rdweb.rendezvous;

enum ConnType {
  DEFAULT_CONN = 0;
  FILE_TRANSFER = 1;
  PORT_FORWARD = 2;
  RDP = 3;
  VIEW_CAMERA = 4;
  TERMINAL = 5;
}

enum NatType {
  UNKNOWN_NAT = 0;
  ASYMMETRIC = 1;
  SYMMETRIC = 2;
}

// Ask hbbs to introduce us to a peer. A browser cannot punch holes, so it
// always reports a SYMMETRIC NAT and the peer answers by meeting us on a
// relay; hbbs then sends us a RelayResponse carrying the server-signed peer
// key, which is what authenticates the peer later in the handshake.
message PunchHoleRequest {
  string id = 1;
  NatType nat_type = 2;
  string licence_key = 3;
  ConnType conn_type = 4;
  string token = 5;
  string version = 6;
  int32 udp_port = 7;
  bool force_relay = 8;
}

message PunchHoleResponse {
  bytes socket_addr = 1;
  bytes pk = 2;
  enum Failure {
    ID_NOT_EXIST = 0;
    OFFLINE = 2;
    LICENSE_MISMATCH = 3;
    LICENSE_OVERUSE = 4;
  }
  Failure failure = 3;
  string relay_server = 4;
  oneof union {
    NatType nat_type = 5;
    bool is_local = 6;
  }
  string other_failure = 7;
  int32 feedback = 8;
}

// Ask hbbs to have the peer meet us on a relay, and the same message (with
// uuid) is the first thing sent to hbbr to join the relay pair.
message RequestRelay {
  string id = 1;
  string uuid = 2;
  bytes socket_addr = 3;
  string relay_server = 4;
  bool secure = 5;
  string licence_key = 6;
  ConnType conn_type = 7;
  string token = 8;
}

message RelayResponse {
  bytes socket_addr = 1;
  string uuid = 2;
  string relay_server = 3;
  oneof union {
    string id = 4;
    // IdPk of the peer signed with the server key (crypto_sign combined form).
    bytes pk = 5;
  }
  string refuse_reason = 6;
  string version = 7;
  int32 feedback = 9;
}

message OnlineRequest {
  string id = 1;
  repeated string peers = 2;
}

message OnlineResponse {
  // Bitmap, one bit per entry of OnlineRequest.peers, MSB first.
  bytes states = 1;
}

// hbbs sends one unsolicited as the first frame of a TCP connection when it
// has a key: keys[0] is its per-process X25519 public key signed with the
// server's Ed25519 key (crypto_sign combined form). hbbs does not send it on
// WebSocket connections.
message KeyExchange {
  repeated bytes keys = 1;
  uint32 version = 2;
  bytes signed_params = 3;
}

message RendezvousMessage {
  oneof union {
    PunchHoleRequest punch_hole_request = 8;
    PunchHoleResponse punch_hole_response = 11;
    RequestRelay request_relay = 18;
    RelayResponse relay_response = 19;
    OnlineRequest online_request = 23;
    OnlineResponse online_response = 24;
    KeyExchange key_exchange = 25;
  }
}
